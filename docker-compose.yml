# =============================================================================
# Orquestacion local.
#
# MODELO DE BASE DE DATOS (ver docs/deployment/environments.md):
# una sola instancia de PostgreSQL por entorno, compartida por todas las
# aplicaciones, con UNA BASE Y UN USUARIO POR APLICACION. En local esa
# instancia la levanta infrastructure/dev-infra/, no este archivo.
#
# Por eso el servicio `postgres` de abajo esta detras del perfil `local-db` y
# NO arranca por defecto. Solo se usa si prefieres una base dedicada a este
# proyecto en vez de la compartida.
#
# Los contenedores NO llevan container_name: Compose los nombra a partir del
# directorio del proyecto, para que varios proyectos derivados de la plantilla
# convivan en la misma maquina.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    profiles: ['local-db']
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      # Puerto del HOST: 5433 a propósito, no el 5432 por defecto de PostgreSQL.
      # Así la base de datos de la aplicación no compite con un PostgreSQL ya
      # instalado en la máquina, que es lo habitual. Dentro de la red de Compose
      # el puerto sigue siendo el estándar 5432.
      # Para usar otro, pon POSTGRES_PORT en tu .env en lugar de editar este
      # archivo, que es compartido.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app-network]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      # Por defecto, la instancia compartida del entorno (host.docker.internal
      # en local, el servidor gestionado en QA y produccion). Con el perfil
      # `local-db`, apunta a `postgres:5432` poniendo DATABASE_URL en tu .env.
      DATABASE_URL: ${DATABASE_URL_CONTAINER:-postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@host.docker.internal:${POSTGRES_PORT:-5433}/${POSTGRES_DB:-app}?schema=public}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      JWT_ISSUER: ${JWT_ISSUER:-enterprise-app}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-enterprise-api}
      # Obligatorio y sin valor por defecto: la API exige >= 32 bytes para firmar
      # tokens, y un secreto de ejemplo en Git acabaria usandose de verdad.
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET:?Define JWT_ACCESS_TOKEN_SECRET (32+ bytes) en .env}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-8h}
      AUTH_DEFAULT_PASSWORD: ${AUTH_DEFAULT_PASSWORD:-}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET:-change-me-in-local-only}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: 'false'
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    extra_hosts:
      # Permite alcanzar la instancia compartida que corre en el host.
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [app-network]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-local}
    restart: unless-stopped
    networks: [app-network]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    networks: [app-network]

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
