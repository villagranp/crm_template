# ---------------------------------------------------------------------------
# Static server for the SPA container.
#
# This is NOT the edge proxy. The edge proxy lives in infrastructure/nginx/ and
# is the only component that terminates client traffic and routes /api/ to the
# backend. This file only serves the compiled bundle inside the frontend image.
#
# Security headers, including the Content-Security-Policy, are set ONLY by the
# edge (infrastructure/nginx/conf.d/security-headers.conf). index.html is served
# here WITH its `__CSP_NONCE__` placeholder: the edge replaces it with the nonce
# of each response (sub_filter). Adding a CSP here would send a second policy
# with a different nonce and block every MUI style.
# ---------------------------------------------------------------------------

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A static bundle only needs GET and HEAD (ASVS 5.0 G-25).
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Hashed build assets are immutable; index.html must never be cached or
    # clients would keep loading a stale bundle after a deployment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Source maps are not built for production (ASVS 5.0 G-17); never served.
    location ~* \.map$ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # SPA fallback: client-side routes are resolved by React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
