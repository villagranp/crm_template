# ---------------------------------------------------------------------------
# Static server for the SPA container.
#
# This is NOT the edge proxy. The edge proxy lives in infrastructure/nginx/ and
# is the only component that terminates client traffic and routes /api/ to the
# backend. This file only serves the compiled bundle inside the frontend image.
# ---------------------------------------------------------------------------

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable; index.html must never be cached or
    # clients would keep loading a stale bundle after a deployment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # SPA fallback: client-side routes are resolved by React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
