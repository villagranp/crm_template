# =============================================================================
# Application server block.
#
# Upstreams resolve to Docker Compose service names on the shared network.
# =============================================================================

upstream frontend_upstream {
    server frontend:8080;
    keepalive 16;
}

upstream backend_upstream {
    server backend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/conf.d/security-headers.conf;

    limit_conn conn_limit 20;

    # Only the methods the application uses (ASVS 5.0 G-25, V13.4.4). TRACE,
    # CONNECT, WebDAV verbs, etc. are answered here with 405 and never reach an
    # upstream. (NGINX already rejects TRACE natively; this makes it explicit
    # and covers every other verb.)
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # Generate a correlation ID at the edge when the client did not send one,
    # so that every request is traceable from the first hop (ADR-016).
    set $correlation_id $http_x_correlation_id;
    if ($correlation_id = '') {
        set $correlation_id $request_id;
    }

    # ---- API ---------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Se SOBRESCRIBE, no se anade: la API confia en un solo salto y un
        # X-Forwarded-For enviado por el cliente no debe llegarle.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Correlation-ID  $correlation_id;
        proxy_set_header Connection        "";

        # Authorization headers must never be cached or shared between users.
        # The upstream's own Cache-Control (e.g. attachment downloads) is hidden so
        # the response carries a single "no-store" header, not a duplicate.
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        # One header of each kind (ASVS 5.0 G-21): Helmet sets these too; the
        # edge's values (security-headers.conf) are the ones that apply. HSTS is
        # decided only at the edge ($hsts_header in nginx.conf).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        # Un add_header aquí anula los del server: se vuelven a incluir las de seguridad.
        include /etc/nginx/conf.d/security-headers.conf;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Subida de adjuntos (ADR-021, 02 F.5) y de la carga masiva de clientes
        # (06 F.1, POST /customer-imports): el archivo puede medir hasta
        # crm.adjuntos.max_mb / crm.importaciones.max_mb (10 MiB, MAX_UPLOAD_MB
        # del registro de parametros) y el cuerpo multipart anade cabeceras y
        # limites. 11m deja ese margen; la API corta en streaming al maximo
        # vigente del parametro (413).
        # Hereda cabeceras de proxy, limites y add_header de este bloque.
        location ~ ^/api/v[0-9]+/([a-z-]+/[^/]+/attachments|customer-imports)$ {
            client_max_body_size 11m;
            proxy_pass http://backend_upstream;
        }
    }

    # Los adjuntos NUNCA se sirven como estaticos (ADR-021): no existe ninguna
    # location hacia ATTACHMENTS_STORAGE_PATH; se descargan por la API tras autorizar.

    # Swagger UI is served by the backend and must stay unreachable in
    # production. Enable this block only in non-production environments.
    location /api/docs {
        return 404;
    }

    # ---- Health ------------------------------------------------------------
    # Edge liveness for load balancers; does not touch the upstreams.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Frontend ----------------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Se SOBRESCRIBE, no se anade: la API confia en un solo salto y un
        # X-Forwarded-For enviado por el cliente no debe llegarle.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header Connection        "";
        # sub_filter only works on an uncompressed body; the edge compresses
        # the final response itself (gzip in nginx.conf).
        proxy_set_header Accept-Encoding   "";

        # CSP nonce (security-headers.conf): the frontend container serves
        # index.html with the `__CSP_NONCE__` placeholder; the edge writes this
        # response's nonce into it. sub_filter only touches text/html.
        sub_filter '__CSP_NONCE__' $request_id;
        sub_filter_once on;

        # index.html must never be cached (it carries the nonce); assets keep
        # the container's Cache-Control. A local add_header drops the inherited
        # ones, so the security headers are included again.
        proxy_hide_header Cache-Control;
        add_header Cache-Control $frontend_cache_control always;
        include /etc/nginx/conf.d/security-headers.conf;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # SPA fallback is handled inside the frontend container; the edge only
        # forwards. Keeping the fallback in one place avoids drift.
    }

    # Source maps are not built for production (ASVS 5.0 G-17); if one ever
    # ends up in the bundle, it is still not served.
    location ~* \.map$ {
        return 404;
    }

    # Deny access to dotfiles that may end up in a static build by mistake.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }
}
