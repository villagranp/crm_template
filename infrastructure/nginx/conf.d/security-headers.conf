# =============================================================================
# Security headers applied to every response served by the edge.
#
# `always` is required so that the headers are emitted on error responses too.
# This is the ONLY layer that sets these headers: for /api/ the edge hides the
# ones Helmet also sets (proxy_hide_header in app.conf and in
# infrastructure/qa-windows/nginx.conf), so every response carries exactly one
# of each (ASVS 5.0 G-21).
#
# Variables this file needs from the including http{} block:
#   $hsts_header  map in nginx.conf / qa-windows/nginx.conf ("" = not sent).
#   $request_id   built-in: 128 random bits per request, used as the CSP nonce.
# =============================================================================

add_header X-Content-Type-Options    "nosniff"                      always;
add_header X-Frame-Options           "DENY"                         always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin"                 always;
add_header Cross-Origin-Resource-Policy "same-origin"               always;

# HSTS: NGINX does not send a header whose value is empty, so this line is inert
# until the environment's http{} block sets $hsts_header (see the map in
# nginx.conf). It is enabled per environment and only with a public-CA
# certificate on the final domain: a wrong max-age is hard to undo.
add_header Strict-Transport-Security $hsts_header always;

# Content-Security-Policy (ASVS 5.0 G-11).
#
# Styles: MUI/Emotion injects <style> elements at runtime. Instead of
# 'unsafe-inline', only <style> elements carrying this response's nonce are
# allowed. The nonce is $request_id (32 hex chars, 128 random bits, new on every
# request). The SAME value is written into index.html by `sub_filter`, replacing
# the `__CSP_NONCE__` placeholder of <meta name="csp-nonce">, and the frontend
# hands it to its Emotion cache (frontend/src/theme/emotion-cache.ts). Every
# location that serves index.html must therefore run that sub_filter and never
# let index.html be cached (a cached page would reuse an old nonce).
# Style attributes set by React go through the CSSOM and are not affected.
#
# Scripts: only same-origin files; no inline execution, no eval.
# base-uri 'none': the SPA never uses <base>.
#
# connect-src allows https://login.microsoftonline.com (Entra ID, ADR-007/ADR-027):
# MSAL redeems the authorization code and renews tokens with `fetch` against that
# host, so without it the sign-in comes back from Microsoft and then fails in the
# browser. Nothing else is opened on purpose: the sign-in is a full-page REDIRECT
# (Authorization Code + PKCE), not a popup or an iframe, so `frame-src` stays on
# `default-src 'self'`, `frame-ancestors 'none'` stays, and the
# Cross-Origin-Opener-Policy above is untouched.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://login.microsoftonline.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
