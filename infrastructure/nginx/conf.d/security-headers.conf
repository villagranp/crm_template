# =============================================================================
# Security headers applied to every response served by the edge.
#
# `always` is required so that the headers are emitted on error responses too.
# The backend sets its own headers via Helmet; both layers are kept because the
# edge also serves static assets that never reach the backend.
# =============================================================================

add_header X-Content-Type-Options    "nosniff"                      always;
add_header X-Frame-Options           "DENY"                         always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin"                 always;
add_header Cross-Origin-Resource-Policy "same-origin"               always;

# HSTS is only meaningful once TLS is terminated in front of this proxy.
# Enable it deliberately per environment; a wrong max-age is hard to undo.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy.
# 'unsafe-inline' for styles is required by Emotion/MUI runtime style injection
# (ADR-009). Scripts do NOT allow inline execution. Tighten connect-src per
# environment when Entra ID is enabled (login.microsoftonline.com).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
