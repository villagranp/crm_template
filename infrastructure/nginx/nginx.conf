# =============================================================================
# Edge reverse proxy — main configuration.
#
# Responsibilities:
#   /      -> frontend container (static SPA bundle)
#   /api/  -> backend container (NestJS)
#
# TLS is intentionally NOT configured here: in the target deployment TLS is
# terminated by the platform ingress (Azure Application Gateway / Front Door).
# A project that terminates TLS at this layer must add a listen 443 ssl block
# and document the change with an ADR (see ADR-011).
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Never advertise the exact NGINX version (information disclosure).
    server_tokens off;

    # ---- Logging -----------------------------------------------------------
    # The correlation ID is logged so that an edge access line can be joined
    # with backend structured logs for the same request (ADR-016).
    log_format main_json escape=json
        '{'
        '"timestamp":"$time_iso8601",'
        '"remoteAddr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytesSent":$body_bytes_sent,'
        '"requestTimeSeconds":$request_time,'
        '"upstream":"$upstream_addr",'
        '"correlationId":"$http_x_correlation_id",'
        '"userAgent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log main_json;

    # ---- Transport ---------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # ---- Request limits ----------------------------------------------------
    client_max_body_size      10m;
    client_body_buffer_size   128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;

    # ---- Rate limiting -----------------------------------------------------
    # Defence in depth only: the authoritative limit is the backend throttler.
    limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ---- Compression -------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- Forwarded protocol (ASVS 5.0 G-25) --------------------------------
    # X-Forwarded-Proto sent by the CLIENT is never trusted: by default the API
    # receives this server's own $scheme. It is legitimate to forward the
    # original scheme only when a known ingress (Azure Front Door / Application
    # Gateway / WAF) terminates TLS in front of this proxy and always overwrites
    # the header. In that case, list the ingress source ranges in the `geo`
    # below (and nothing else): only requests coming FROM those addresses may
    # pass their X-Forwarded-Proto through. The list is empty on purpose.
    # With that extra hop the backend must also trust two proxies:
    # TRUST_PROXY_HOPS=2 (1, the default, when only this NGINX is in front), and
    # X-Forwarded-For in app.conf must then append ($proxy_add_x_forwarded_for)
    # instead of overwriting, so the API sees the ingress-reported client IP.
    geo $from_trusted_ingress {
        default 0;
        # 10.10.0.0/24 1;   # example: subnet of the Application Gateway
    }

    map "$from_trusted_ingress:$http_x_forwarded_proto" $forwarded_scheme {
        default   $scheme;
        "1:https" https;
        "1:http"  http;
    }

    # ---- HSTS (security-headers.conf) --------------------------------------
    # Empty value = header not sent. Enable it ONLY in production, once the
    # final domain serves a certificate from a public CA (also behind the
    # ingress: the browser sees this header through it). Start with a short
    # max-age if in doubt; `preload` is a separate, hard-to-revert decision.
    map $scheme $hsts_header {
        default "";
        # default "max-age=31536000; includeSubDomains";
    }

    # ---- HTML responses ------------------------------------------------------
    # index.html carries the per-response CSP nonce (security-headers.conf), so
    # it must never be cached; hashed assets keep the frontend's own policy.
    map $upstream_http_content_type $frontend_cache_control {
        default      $upstream_http_cache_control;
        ~^text/html  "no-store";
    }

    include /etc/nginx/conf.d/*.conf;
}
