# =============================================================================
# NGINX de QA en Windows Server (ADR-026). Runbook: docs/deployment/qa-windows.md
#
# Se arranca con este archivo tal cual, desde el clon del repositorio:
#   C:\nginx\nginx.exe -p C:\nginx\ -c C:\apps\mi-cliente-ag\infrastructure\qa-windows\nginx.conf
#
# Rutas fijas de la convención de QA (si el servidor usa otras, se cambian aquí):
#   C:/nginx                          NGINX for Windows (logs, mime.types, ssl/)
#   C:/apps/mi-cliente-ag             clon del repositorio (frontend/dist)
# Mismas reglas que infrastructure/nginx (Docker): cabeceras de seguridad,
# correlation ID en el borde, límites, sin caché en /api y Swagger cerrado.
# =============================================================================

# NGINX for Windows solo usa un proceso de trabajo de forma fiable.
worker_processes 1;
error_log logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       C:/nginx/conf/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format main_json escape=json
        '{'
        '"timestamp":"$time_iso8601",'
        '"remoteAddr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytesSent":$body_bytes_sent,'
        '"requestTimeSeconds":$request_time,'
        '"upstream":"$upstream_addr",'
        '"correlationId":"$http_x_correlation_id",'
        '"userAgent":"$http_user_agent"'
        '}';
    access_log logs/access.log main_json;

    sendfile           on;
    tcp_nodelay        on;
    keepalive_timeout  65;

    client_max_body_size        10m;
    client_body_buffer_size     128k;
    client_header_buffer_size   4k;
    large_client_header_buffers 4 16k;
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;

    limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # HSTS (security-headers.conf): valor vacío = no se envía. NO se activa en QA:
    # el certificado es autofirmado o de la CA interna y la dirección la comparte
    # con otra aplicación (IIS); HSTS ataría a ese host todas sus aplicaciones.
    # Solo producción, con dominio propio y certificado de CA pública (ver
    # infrastructure/nginx/nginx.conf).
    map $scheme $hsts_header {
        default "";
    }

    # El backend escucha solo en la máquina (API_PORT=3000, nunca expuesto).
    upstream backend_upstream {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # HTTP solo redirige: la cookie de sesión es `Secure` fuera de desarrollo y
    # el navegador la descarta sobre HTTP. En el 8080 porque el 80 del servidor de
    # QA lo ocupa IIS (http.sys), que sirve otras cosas y no se toca.
    server {
        listen 8080;
        server_name _;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        # Certificado del servidor (autofirmado para la IP o de la CA interna;
        # con el dominio de QA, el emitido para ese nombre). Nunca en Git.
        ssl_certificate     C:/nginx/ssl/qa.crt;
        ssl_certificate_key C:/nginx/ssl/qa.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;

        # Un add_header en un location anula los heredados: por eso cada location
        # que define cabeceras propias vuelve a incluir las de seguridad.
        include C:/apps/mi-cliente-ag/infrastructure/nginx/conf.d/security-headers.conf;

        limit_conn conn_limit 20;

        # Solo los métodos que usa la aplicación (ASVS 5.0 G-25, V13.4.4): TRACE,
        # CONNECT, verbos WebDAV, etc. reciben 405 aquí y no llegan a la API.
        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
            return 405;
        }

        # Correlation ID desde el primer salto (ADR-016).
        set $correlation_id $http_x_correlation_id;
        if ($correlation_id = '') {
            set $correlation_id $request_id;
        }

        # ---- API -------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # Se SOBRESCRIBE, no se añade: la API confía en un solo salto.
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_set_header X-Correlation-ID  $correlation_id;
            proxy_set_header Connection        "";

            proxy_cache off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            include C:/apps/mi-cliente-ag/infrastructure/nginx/conf.d/security-headers.conf;

            # Una sola cabecera de cada tipo (ASVS 5.0 G-21): helmet también las
            # pone; valen las del borde. HSTS solo lo decide el borde ($hsts_header).
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;
            proxy_hide_header Cross-Origin-Resource-Policy;
            proxy_hide_header Cross-Origin-Embedder-Policy;
            proxy_hide_header Permissions-Policy;
            proxy_hide_header Strict-Transport-Security;

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Adjuntos (ADR-021) y carga masiva de clientes (06 F.1): hasta 10 MiB
            # (MAX_UPLOAD_MB) más el multipart. La API corta al máximo vigente (413).
            location ~ ^/api/v[0-9]+/([a-z-]+/[^/]+/attachments|customer-imports)$ {
                client_max_body_size 11m;
                proxy_pass http://backend_upstream;
            }
        }

        # Swagger cerrado también en QA (SWAGGER_ENABLED=false en el backend).
        location /api/docs {
            return 404;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ---- Frontend (build estático de Vite) ------------------------------
        root  C:/apps/mi-cliente-ag/frontend/dist;
        index index.html;

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            include C:/apps/mi-cliente-ag/infrastructure/nginx/conf.d/security-headers.conf;
            try_files $uri =404;
        }

        # Toda ruta de la SPA acaba aquí (try_files e index hacen una redirección
        # interna a /index.html). Nonce de la CSP (security-headers.conf): se
        # escribe el de esta respuesta en <meta name="csp-nonce">; por eso nunca
        # se guarda en caché.
        location = /index.html {
            add_header Cache-Control "no-store, must-revalidate" always;
            include C:/apps/mi-cliente-ag/infrastructure/nginx/conf.d/security-headers.conf;
            sub_filter '__CSP_NONCE__' $request_id;
            sub_filter_once on;
        }

        # El build de producción no genera mapas de código fuente (G-17); si alguno
        # llegara a dist, tampoco se sirve.
        location ~* \.map$ {
            return 404;
        }

        # Fallback de la SPA.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Los adjuntos NUNCA se sirven como estáticos (ADR-021).
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
        }
    }
}
